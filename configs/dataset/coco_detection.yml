task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 10
remap_mscoco_category: True

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: D:\DataSet\VisDrone2019-DET_coco\coco\train2017
    ann_file: D:\DataSet\VisDrone2019-DET_coco\coco\annotations\instances_train2017.json
#    img_folder: D:\Code\Study\RT-DETR-main\RT-DETR-main\rtdetr_pytorch\configs\dataset\coco\train2017
#    ann_file: D:\Code\Study\RT-DETR-main\RT-DETR-main\rtdetr_pytorch\configs\dataset\coco\annotations\instances_train2017.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction


